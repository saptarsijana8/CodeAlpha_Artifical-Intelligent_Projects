<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Lingua - Language Translator</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <nav class="navbar">
        <div class="logo">🌐 Lingua</div>
        <span>Language Translator</span>
    </nav>

    <main class="container">

        <section class="heading">
            <p class="tagline">BREAK LANGUAGE BARRIERS</p>

            <h1>Translate Anything,<br>
                <span>Anywhere.</span>
            </h1>

            <p class="description">
                Translate your words into different languages
                quickly and easily.
            </p>
        </section>

        <section class="translator">

            <div class="language-bar">

                <div class="language-select">
                    <label for="source">From</label>

                    <select id="source">
                        <option value="en">English</option>
                        <option value="hi">Hindi</option>
                        <option value="fr">French</option>
                        <option value="es">Spanish</option>
                        <option value="de">German</option>
                        <option value="it">Italian</option>
                        <option value="ja">Japanese</option>
                        <option value="zh-CN">Chinese</option>
                        <option value="ar">Arabic</option>
                        <option value="bn">Bengali</option>
                        <option value="ta">Tamil</option>
                        <option value="te">Telugu</option>
                        <option value="mr">Marathi</option>
                        <option value="pt">Portuguese</option>
                        <option value="ru">Russian</option>
                    </select>
                </div>

                <button id="swapBtn" class="swap-btn" title="Swap languages">⇄</button>

                <div class="language-select">
                    <label for="target">To</label>

                    <select id="target">
                        <option value="hi">Hindi</option>
                        <option value="en">English</option>
                        <option value="fr">French</option>
                        <option value="es">Spanish</option>
                        <option value="de">German</option>
                        <option value="it">Italian</option>
                        <option value="ja">Japanese</option>
                        <option value="zh-CN">Chinese</option>
                        <option value="ar">Arabic</option>
                        <option value="bn">Bengali</option>
                        <option value="ta">Tamil</option>
                        <option value="te">Telugu</option>
                        <option value="mr">Marathi</option>
                        <option value="pt">Portuguese</option>
                        <option value="ru">Russian</option>
                    </select>
                </div>

            </div>

            <div class="text-areas">

                <div class="text-box">
                    <textarea id="inputText" placeholder="Enter text to translate..." maxlength="5000"></textarea>

                    <div class="text-footer">
                        <span id="charCount">0 / 5000</span>
                        <button id="clearBtn">Clear</button>
                    </div>
                </div>

                <div class="text-box output-box">
                    <div id="outputText" class="output-text">
                        Your translation will appear here...
                    </div>

                    <div class="text-footer">
                        <span>Translated Text</span>
                        <div class="output-actions">
                            <button id="copyBtn">📋 Copy Text</button>
                            <button id="speakBtn">🔊 Listen</button>
                            <button id="stopBtn">⏹ Stop</button>
                        </div>
                    </div>
                </div>

            </div>

            <button id="translateBtn" class="translate-btn">
                Translate Text →
            </button>

            <p id="status" class="status"></p>

        </section>

        <footer>
            <p>Made by Saptarsi Jana | Lingua Language Translator</p>
        </footer>

    </main>

    <script src="{{ url_for('static', filename='script.js') }}"></script>

</body>

</html>
